function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=3500;nG=AC.createGain();nG.gain.value=0;s.connect(f);f.connect(nG);nG.connect(AC.destination);s.start()}catch(e){}}

function onMot(e){const a=e.accelerationIncludingGravity,r=e.rotationRate;if(a&&a.x!=null){hasS=1;E=Math.max(E,cl((Math.abs(Math.hypot(a.x,a.y,a.z)-9.81)-1)/10))}if(r&&st=='pan'&&Math.abs(r.beta||0)>280)doFlip()}
function onOri(e){if(e.beta==null)return;if(!g0)g0={b:e.beta,g:e.gamma};tilt.x=cl((e.gamma-g0.g)/30,-1,1);tilt.y=cl((e.beta-g0.b)/30,-1,1)}
function sensors(){const go=()=>{addEventListener('devicemotion',onMot);addEventListener('deviceorientation',onOri)},DM=window.DeviceMotionEvent;try{DM&&DM.requestPermission?DM.requestPermission().then(r=>r=='granted'&&go()).catch(()=>{}):go()}catch(e){}}

/* ---------- flow ---------- */
function act(t,f){const b=$('#act');b.textContent=t;b.hidden=false;b.onclick=()=>{b.hidden=true;f()}}
function setStage(s){st=s;stT=0;$('#act').hidden=true;$('#tools').hidden=s!='plate';[...$('#dots').children].forEach((d,i)=>d.classList.toggle('on',i<=['crack','whisk','pan','plate'].indexOf(s)));
if(s=='whisk'){m=0;trail=[];bubs=[];sw=0}
if(s=='pan'){v=1;size=0;spr=0;cb=ct=0;pc={x:0,y:0};deps=[];bw={x:W*.74,y:H*.2};g0=null;flip=null;flips=0;smoke=[];bA=1;bT=0;po={x:0,y:0};planned=0;hOv=0}
hint(({crack:'Tap the egg to crack it',whisk:'Stir with your finger to whisk',pan:'Hold the bowl and drag it over the pan'})[s]||'')}
function newGame(){eg={n:0,i:0,tk:0,sp:-1};yolks=[];m=0;trail=[];bubs=[];DX.clearRect(0,0,D,D);hist=[];tool=null;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));setStage('crack')}
function tapEgg(){if(eg.i>1||eg.sp>=0)return;eg.n++;eg.tk=1;tick(200+eg.n*110,.07,.2);if(eg.n>=3){eg.sp=0;tick(150,.25,.25);yolks.push({k:eg.i,t:0});hint('')}else hint(eg.n==1?'Tap again':'Once more')}
function doFlip(){if(st!='pan'||flip||!deps.length||T-lastF<1.3)return;lastF=T;if(cb<.4){hOv=T+2.2;hint('Still runny. Wait for the edges to set');return}flip={t:0};flips++;tick(330,.15,.2)}
function goPlate(){bake(liq(0),cb,cb);const g=c=>1-cl(Math.abs(c-1.05)/.9),sc=(g(cb)+g(ct))/2,mx=Math.max(cb,ct),mn=Math.min(cb,ct),n=sc>.78?3:sc>.5?2:1;
res=(mx>1.75?'Burnt, but brave':mx<.55?'Still a bit raw':mn<.35?'Golden on one side':sc>.8?'Perfectly golden':sc>.55?'Nicely done':'Rustic')+'  '+'★'.repeat(n)+'☆'.repeat(3-n);
DX.clearRect(0,0,D,D);hist=[];tool={t:'s',i:0};setStage('plate');document.querySelector('#r1 .chip').classList.add('on');hint(res);tick(700,.12,.2)}

/* ---------- update ---------- */
function uPan(dt){
if(ptr.d&&ptr.pan){const nx=lp(po.x,cl(ptr.x-ptr.sx,-R*.3,R*.3),.3),ny=lp(po.y,cl(ptr.y-ptr.sy,-R*.3,R*.3),.3);E=Math.max(E,cl(Math.hypot(nx-po.x,ny-po.y)/dt/900));po.x=nx;po.y=ny}else{const k=1-Math.min(1,dt*6);po.x*=k;po.y*=k}
const fl=1-cl((cb-.12)/.4),tx=cl(tilt.x+po.x/(R*.3),-1,1),ty=cl(tilt.y+po.y/(R*.3),-1,1);
const pst=pour&&v>0&&bT>.6;if(pour&&v>0)v=Math.max(0,v-dt*.2);
if(v<=0&&!deps.length){v=1;bA=1;hOv=T+2.2;hint('Missed the pan. Here is a fresh bowl')}
const pd=1-v;size=pd>0?.1+pd*.8:0;
if(pst){const[,,lx,ly]=lnd(),ux=(lx-cx-po.x)/R,uy=(ly-H*.54-po.y)/R;if(Math.hypot(ux,uy)<.84){let n=null,nd=9;for(const d of deps){const q=Math.hypot(d.x-ux,d.y-uy);if(q<nd){nd=q;n=d}}if(n&&(nd<Math.max(.05,n.r*.7)||deps.length>140))n.r=Math.min(.5,n.r+dt*.1);else deps.push({x:ux,y:uy,r:.07})}}
if(deps.length){const rc=.12+.5*pd,g=dt*(.01+.35*E+.1*Math.hypot(tx,ty))*fl;for(const d of deps){if(d.r<rc)d.r=Math.min(rc,d.r+g);d.x+=tx*dt*.25*fl;d.y+=ty*dt*.25*fl;const mx=Math.max(0,.88-d.r),l=Math.hypot(d.x,d.y);if(l>mx){d.x*=mx/l;d.y*=mx/l}}
cb+=dt/20;ct+=dt/200;if(cb>1.35&&Math.random()<dt*(6+(cb-1.35)*20))smoke.push({x:rnd(-.5,.5)*R,y:rnd(-.3,.3)*R,t:0,r:rnd(8,14)})}
smoke.forEach(s=>{s.t+=dt;s.y-=26*dt;s.x+=8*dt;s.r+=9*dt});smoke=smoke.filter(s=>s.t<2.4);
if(flip){flip.t+=dt/.85;if(!flip.s&&flip.t>.5){flip.s=1;[cb,ct]=[ct,cb];deps.forEach(d=>d.x*=-1)}if(flip.t>=1){flip=null;land=1;tick(170,.12,.25)}}
land=Math.max(0,land-dt*5);bA=v>0?1:Math.max(0,bA-dt*1.5);bT=lp(bT,pour&&v>0?1:0,Math.min(1,dt*10));
if(!planned&&size>.1&&(cb>.6||ct>.5)){planned=1;act('Plate it',goPlate)}
if(T>hOv)hint(v>0&&!deps.length?(pour?'Move the bowl over the pan':'Hold the bowl, then drag it over the pan'):pour&&v>0?'Keep moving to pour where you like':flips?'Cook the other side, then plate it':cb<.4?(hasS?'Shake the pan to spread the egg':'Drag the pan to spread the egg'):(hasS?'Set? Tilt the pan up quickly to flip':'Set? Flick the pan upward to flip'))}
function uPlate(dt){if(!ptr.d||!tool)return;const dx=ptr.x-ptr.lx,dy=ptr.y-ptr.ly,dist=Math.hypot(dx,dy);ptr.sp=lp(ptr.sp,dist/dt,.25);
if(tool.t=='s'){ptr.hold=ptr.sp<50?Math.min(1.6,ptr.hold+dt):Math.max(0,ptr.hold-dt*3);const r=cl(3.6-ptr.sp/450,1.9,3.6)+ptr.hold*6;
if(dist>.8||r>ptr.lr+.3){const n=Math.max(1,Math.ceil(dist/1.4));for(let i=1;i<=n;i++)dab(ptr.lx+dx*i/n,ptr.ly+dy*i/n,r,SA[tool.i][1]);ptr.lr=r;ptr.lx=ptr.x;ptr.ly=ptr.y}}
else if(dist>=TP[tool.i][1]){stamp(DX,tool.i,(ptr.x-cx+PR)*K,(ptr.y-cy+PR)*K,K);ptr.lx=ptr.x;ptr.ly=ptr.y}}
function update(dt){
if(st=='crack'){eg.tk=Math.max(0,eg.tk-dt*4);if(eg.sp>=0){eg.sp+=dt/.9;if(eg.sp>=1){eg.i++;eg.n=0;eg.sp=-1;hint(eg.i==1?'Now the second egg':'');if(eg.i==2)setTimeout(()=>st=='crack'&&setStage('whisk'),600)}}yolks.forEach(y=>y.t+=dt)}
else if(st=='whisk'){bubs=bubs.filter(b=>T-b.t<1);while(trail.length&&T-trail[0].t>1.4)trail.shift()}
else if(st=='pan')uPan(dt);else if(st=='plate')uPlate(dt);
if(nG&&AC)nG.gain.setTargetAtTime(st=='pan'&&deps.length?.03+size*.05+(cb>1.5?.03:0):0,AC.currentTime,.15);
E*=1-Math.min(1,dt*4)}

/* ---------- render ---------- */
function rCrack(){const by=bcy();bowl(cx,by,BR);bliq(cx,by,BR);
if(eg.i<2){const kn=eg.tk,ex=cx,ey=by-BR*.98+Math.sin(T*2.2)*3+kn*16,rot=Math.sin(T*2)*.04+(kn?Math.sin(kn*12)*.08:0);
if(eg.sp<0){shd(cx,by-BR*.3,BR*.2,BR*.13,.14);egg(ex,ey,rot,0,0,0,[0,.35,.8][eg.n])}
else{const s=eg.sp,e=ez(s);X.globalAlpha=1-ez((s-.6)/.4);egg(ex,ey,rot-e*.9,1,-e*BR*.4,-e*BR*.18,1);egg(ex,ey,rot+e*.9,-1,e*BR*.4,e*BR*.1,1);X.globalAlpha=1}}}
function rWhisk(){const by=bcy();bowl(cx,by,BR);bliq(cx,by,BR);const f=ptr.d?ptr:{x:cx+BR*.62,y:by+BR*.5};fork(f.x,f.y,-.5)}
function rPan(){const px=cx+po.x+Math.sin(T*43)*E*3,py=H*.54+po.y+Math.cos(T*37)*E*3;pan(px,py,R);
if(deps.length){ome(oc,tc,liq(E*.03*(1-cl((cb-.1)/.4))),P/2,ct,cb);X.save();
if(flip){const f=flip.t,h=Math.sin(Math.PI*f),s=1+h*.1;X.translate(px,py-h*R*.5);X.rotate(h*.15);X.scale(s,Math.max(.04,Math.abs(Math.cos(Math.PI*f)))*s)}else{X.translate(px,py);X.scale(1+land*.04,1-land*.04)}
X.drawImage(oc,-R,-R,2*R,2*R);X.restore()}
for(const s of smoke){X.fillStyle=`rgba(120,115,110,${.25*(1-s.t/2.4)})`;ci(px+s.x,py+s.y,s.r);X.fill()}
if(bA>0){bowlPour();


}}
function lnd(){const[bx,by,br]=bpos(),ta=-.55*bT,sx=bx-br*.95*Math.cos(ta),sy=by-br*.95*Math.sin(ta);return[sx,sy,sx-5,sy+R*.5]}
function liq(w){return deps.map((d,i)=>({x:d.x+Math.sin(T*11+i*2.3)*w,y:d.y+Math.cos(T*9+i*1.7)*w,r:d.r}))}
function bowlPour(){const[bx,by,br]=bpos(),ta=-.55*bT,[sx,sy,lx,ly]=lnd();X.save();X.globalAlpha=bA;shd(bx+br*.2,by+R*.5+br*.15,br,br*.45,.2);
if(pour&&v>0&&bT>.5){X.lineCap='round';X.strokeStyle='#f2c94c';X.lineWidth=6+Math.sin(T*30);X.beginPath();X.moveTo(sx,sy);X.bezierCurveTo(sx-8,sy+R*.2,lx+2,ly-R*.22,lx,ly);X.stroke();
X.strokeStyle='rgba(255,250,215,.85)';X.lineWidth=2;X.setLineDash([9,13]);X.lineDashOffset=-T*160;X.beginPath();X.moveTo(sx-1.5,sy);X.bezierCurveTo(sx-9,sy+R*.2,lx+.5,ly-R*.22,lx-1.5,ly);X.stroke();X.setLineDash([]);
const k=(T*3)%1;X.strokeStyle=`rgba(246,205,90,${.7*(1-k)})`;X.lineWidth=1.5;ci(lx,ly,5+k*13);X.stroke();
for(let i=0;i<4;i++){const f=(T*4+i*.25)%1,a=i*1.57+T*3;X.fillStyle='rgba(246,205,90,.85)';ci(lx+Math.cos(a)*(4+f*11),ly+Math.sin(a)*(4+f*11)*.6-Math.sin(f*3.14)*8,1.7);X.fill()}}
X.translate(bx,by);X.rotate(ta);
let g=X.createLinearGradient(0,0,0,br);g.addColorStop(0,'#dfe8dc');g.addColorStop(1,'#aebfaa');X.fillStyle=g;X.beginPath();X.moveTo(-br,0);X.bezierCurveTo(-br,br*1.05,br,br*1.05,br,0);X.closePath();X.fill();
X.fillStyle='#f3f7f0';X.beginPath();X.ellipse(0,0,br,br*.5,0,0,7);X.fill();
g=X.createLinearGradient(-br,-br*.4,br*.5,br*.5);g.addColorStop(0,'#a9bba5');g.addColorStop(1,'#dce7d8');X.fillStyle=g;X.beginPath();X.ellipse(0,br*.02,br*.88,br*.42,0,0,7);X.fill();
if(v>0){const rx=br*.8*Math.sqrt(v)+br*.05;X.fillStyle='#f3cd5e';X.beginPath();X.ellipse(-bT*br*.22,br*.06,rx,rx*.46,0,0,7);X.fill();X.fillStyle='rgba(255,255,255,.45)';X.beginPath();X.ellipse(-bT*br*.22-rx*.3,br*.06-rx*.12,rx*.28,rx*.1,0,0,7);X.fill()}
X.restore()}
function rPlate(){scene(cx,cy,PR,ez(stT/.7))}
function draw(){X.setTransform(DPR,0,0,DPR,0,0);X.clearRect(0,0,W,H);({crack:rCrack,whisk:rWhisk,pan:rPan,plate:rPlate}[st]||(()=>0))();const f=1-ez(stT/.4);if(f>0){X.fillStyle=`rgba(255,255,255,${f})`;X.fillRect(0,0,W,H)}}
let last=now();function loop(){const t=now(),dt=Math.min(.05,t-last);last=t;T=t;stT+=dt;update(dt);draw();requestAnimationFrame(loop)}

/* ---------- input ---------- */
const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const p=pt(e);ptr={d:1,x:p.x,y:p.y,sx:p.x,sy:p.y,lx:p.x,ly:p.y,sp:0,hold:0,lr:0,la:null,h:[[now(),p.y]]};
if(st=='crack')tapEgg();
else if(st=='pan'){const[bx,by,br]=bpos();pour=v>0&&Math.hypot(p.x-bx,p.y-by)<br*2;ptr.pan=!pour;ptr.gx=bx-p.x;ptr.gy=by-p.y}
else if(st=='plate'&&tool){if(hist.push(DX.getImageData(0,0,D,D))>12)hist.shift();if(tool.t=='t'){stamp(DX,tool.i,(p.x-cx+PR)*K,(p.y-cy+PR)*K,K)}}};
cv.onpointermove=e=>{if(!ptr.d)return;const p=pt(e);ptr.x=p.x;ptr.y=p.y;
if(st=='whisk'){const c=bcy(),a=Math.atan2(p.y-c,p.x-cx),dd=Math.hypot(p.x-cx,p.y-c);
if(ptr.la!=null&&dd<BR*.84&&dd>BR*.08){let d=a-ptr.la;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;sw+=d*.6;if(m<1){m=Math.min(1,m+Math.abs(d)*.04);if(Math.random()<.6)bubs.push({x:p.x+rnd(-8,8),y:p.y+rnd(-8,8),r:rnd(1.5,4),t:T});if(m>=1){tick(660,.15,.2);hint('');act('Pour into the pan',()=>setStage('pan'))}}}
ptr.la=a;trail.push({x:p.x,y:p.y,t:T});if(trail.length>40)trail.shift()}
if(st=='pan'&&pour){const br=R*.3;bw.x=cl(p.x+ptr.gx,br,W-br);bw.y=cl(p.y+ptr.gy,br,H-br)}
if(st=='pan'&&ptr.pan){const t=now();ptr.h.push([t,p.y]);while(ptr.h.length&&t-ptr.h[0][0]>.22)ptr.h.shift();if(ptr.h.length>2&&p.y-ptr.h[0][1]<-R*.5)doFlip()}};
cv.onpointerup=cv.onpointercancel=()=>{ptr.d=0;pour=false};

/* ---------- ui ---------- */
function chip(inner,fn){const b=document.createElement('button');b.className='chip';b.append(inner);b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==b));fn()};return b}
SA.forEach((s,i)=>{const e=document.createElement('i');e.style.background=s[1];$('#r1').append(chip(e,()=>{tool={t:'s',i};hint(s[0]+': hold to squeeze, drag to draw')}))});
TP.forEach((s,i)=>{const c=mk(28);stamp(c.getContext('2d'),i,14,14,1);$('#r2').append(chip(c,()=>{tool={t:'t',i};hint(s[0]+': tap or drag to sprinkle')}))});
$('#undo').onclick=()=>{const h=hist.pop();if(h)DX.putImageData(h,0,0)};
$('#clr').onclick=()=>{DX.clearRect(0,0,D,D);hist=[]};
$('#nw').onclick=newGame;
$('#go').onclick=()=>{audio();sensors();$('#intro').hidden=true;newGame()};
$('#cl').onclick=()=>{$('#ov').hidden=true};
$('#save').onclick=()=>{const o=X;X=null;const c=document.createElement('canvas');c.width=1080;c.height=1200;X=c.getContext('2d');X.fillStyle='#fff';X.fillRect(0,0,1080,1200);scene(540,560,470,1);X.fillStyle='#b7b1a6';X.font='500 28px Prompt,"Noto Sans Thai",sans-serif';X.textAlign='center';X.fillText('เจียวรับน้องบรม',540,1130);X=o;
c.toBlob(b=>{blob=b;$('#oi').src=URL.createObjectURL(b);$('#rt').textContent=res;$('#dl').hidden=!dls;$('#ov').hidden=false;tick(520,.1)},'image/png')};
$('#dl').onclick=()=>{if(dls&&blob)dls.save({filename:'jiao-rap-nong-borom.png',data:blob}).catch(()=>{})};
try{window.claude&&claude.use&&claude.use('downloads').then(d=>{dls=d}).catch(()=>{})}catch(e){}
function icon(){const o=X;X=$('#ic').getContext('2d');bake(circs(.74,{x:0,y:0},0),.95,.95);scene(150,150,132,1);X=o}
new ResizeObserver(fit).observe($('#stage'));fit();icon();requestAnimationFrame(loop);
</script></body></html>
